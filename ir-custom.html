itional individual talent continued to enhance the team’s performance (Figures 1 and 2).\n\nIn looking for an explanation for the different results for different sports, the researchers isolated one important factor – the extent to which a good performance by a team requires its members to coordinate their actions. This task interdependence differentiates baseball from basketball and football. In baseball, the performance of individual players is less dependent on teammates than in football and basketball. The researchers concluded that when, during the course of play, task interdependence is high, team performance will suffer when there is too much talent in the group. When task interdependence is lower, on the other hand, individual talent will have a positive effect on team performance.", "cs_tokens": [{"t": "w", "v": "A"}, {"t": "w", "v": "recent"}, {"t": "w", "v": "series"}, {"t": "w", "v": "of"}, {"t": "w", "v": "studies"}, {"t": "w", "v": "examined"}, {"t": "w", "v": "the"}, {"t": "w", "v": "role"}, {"t": "w", "v": "of"}, {"t": "w", "v": "talent"}, {"t": "w", "v": "in"}, {"t": "w", "v": "the"}, {"t": "w", "v": "sports"}, {"t": "w", "v": "world."}, {"t": "w", "v": "They"}, {"t": "w", "v": "focused"}, {"t": "w", "v": "on"}, {"t": "w", "v": "three"}, {"t": "w", "v": "different"}, {"t": "w", "v": "sports:"}, {"t": "w", "v": "World"}, {"t": "w", "v": "Cup"}, {"t": "w", "v": "football,"}, {"t": "w", "v": "professional"}, {"t": "w", "v": "basketball"}, {"t": "w", "v": "and"}, {"t": "w", "v": "professional"}, {"t": "w", "v": "baseball."}, {"t": "w", "v": "The"}, {"t": "w", "v": "results"}, {"t": "w", "v": "were"}, {"t": "w", "v": "mixed."}, {"t": "w", "v": "For"}, {"t": "w", "v": "football"}, {"t": "w", "v": "and"}, {"t": "w", "v": "basketball,"}, {"t": "w", "v": "the"}, {"t": "w", "v": "studies"}, {"t": "w", "v": "revealed"}, {"t": "w", "v": "that"}, {"t": "w", "v": "adding"}, {"t": "w", "v": "talented"}, {"t": "w", "v": "players"}, {"t": "w", "v": "to"}, {"t": "w",     <div class="note">用时 ${Math.floor(used/60)} 分 ${used%60} 秒。答案与讲解请看老师发的讲解版。</div>`;
}

      });

      if (!set.size) return;
      const words = [...set].sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+'));
      const re = new RegExp('\\b(' + words.join('|') + ')\\b', 'gi');

      const nodes = [];
      while (walker.nextNode()) { re.lastIndex = 0; if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode); }
      nodes.forEach(n => {
        const frag = document.createDocumentFragment();
        const s = n.nodeValue;
        let last = 0;
        re.lastIndex = 0;
        for (let m; (m = re.exec(s));) {

          frag.appendChild(sp);
          last = m.index + m[0].length;
        }
        if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));

/* ================= Interactive Reading 适配器 =================
 * 依赖原页面的全局变量：cur, si, ans, left, done, SETS, STAGES
 * 以及函数：load, draw, grade, tick

(() => {
  const NAME_KEY = 'sb_student_name';

  let sid = SB.uuid();
  let lastSig = '', lastBeat = 0;

  window.SYNC_ADAPTER = {
    task: 'IR',
    hlRoot: '#body',
    getName: () => who.value.trim(),
    setName: n => { who.value = n; onName(); },
    setNum: () => cur.num,
    contextFor: word => {
      const sents = cur.passage.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]*["”’)]*/g) || [];
      const re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
      const s = sents.find(x => re.test(x));
      return s ? s.trim() : '';
    },
    // 高亮题里，选中文字会被当作答案；标生词时要把答案还原
    snapshot: () => {
      const k = STAGES[si][0];
      return (k === 'h1' || k === 'h2') ? { k, v: ans[k] } : null;
    },
    restore: s => {
      if (!s || done) return;
      ans[s.k] = s.v;
      const p = $('picked');
      if (p) p.textContent = s.v || '（还没选）';
    }
  };

  /* ---------- 作答快照 ---------- */
  function row(status) {
    return {
      id: sid, student_name: who.value.trim(), set_num: cur.num, si, status,
      answers: ans, left_seconds: Math.max(left, 0), time_used_seconds: cur.timer - Math.max(left, 0)
    };
  }
  function autosave() {
    if (done || !who.value.trim()) return;
    const sig = JSON.stringify([cur.num, si, ans, who.value.trim()]);
    const now = Date.now();
    const hasAnswer = Object.keys(ans.cs).length || ans.cp !== null || ans.h1 || ans.h2 || ans.idea !== null || ans.title !== null;
    if (!hasAnswer) return;
    if (sig !== lastSig || now - lastBeat > 20000) {
      lastSig = sig; lastBeat = now;
      SB.saveSubmission(row('in_progress'));
    }
  }
  setInterval(autosave, 2000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && !done && who.value.trim() && lastSig) SB.saveSubmission(row('in_progress'), { now: true });
  });

  /* ---------- 断点续做 ---------- */
  async function tryRestore() {
    const name = who.value.trim();
    if (!name || done) return;
    const num = cur.num;
    let r;
    try { r = await SB.findInProgress(name, num); } catch (e) { console.warn(e); return; }
    if (!r || r.id === sid || cur.num !== num || done) return;
    const age = Date.now() - new Date(r.updated_at).getTime();
    if (age > 7 * 86400e3) return;
    const lf = r.left_seconds || 0;
    const msg = `检测到你上次做 #${num} 还没交卷（第 ${(r.si || 0) + 1}/6 步，剩 ${Math.floor(lf / 60)} 分 ${lf % 60} 秒）。\n\n要接着上次继续做吗？\n（选「取消」则重新开始）`;
    if (confirm(msg)) {
      sid = r.id;
      ans = Object.assign({ cs: {}, cp: null, h1: '', h2: '', idea: null, title: null }, r.answers || {});
      si = Math.min(Math.max(r.si || 0, 0), 5);
      if (lf > 0) left = lf;
      lastSig = '';
      draw();
      SB.toast('已恢复上次的作答');
    } else {
      SB.markAbandoned(r.id).catch(() => {});
    }
  }

  function onName() {
    const n = who.value.trim();
    try { localStorage.setItem(NAME_KEY, n); } catch (e) {}
    SB.loadVocab();
    if (n) SB.setBadge('', '☁ 云同步已就绪');
    tryRestore();
  }
  who.addEventListener('change', onName);
  who.addEventListener('keydown', e => { if (e.key === 'Enter') who.blur(); });

  /* ---------- 换题：新的一次作答 ---------- */
  const origLoad = load;
  load = function (i) {
    if (!done && lastSig && who.value.trim()) SB.saveSubmission(row('in_progress'), { now: true });
    origLoad(i);
    sid = SB.uuid(); lastSig = ''; lastBeat = 0;
    tryRestore();
  };

  /* ---------- 交卷：上传逐题对错 ---------- */
  const L = 'ABCD';
  function items() {
    const out = [];
    const toks = cur.cs_tokens;
    toks.forEach((t, i) => {
      if (t.t !== 'gap') return;
      const pre = toks.slice(Math.max(0, i - 6), i).map(x => x.t === 'gap' ? '___' : x.v).join(' ');
      const post = toks.slice(i + 1, i + 5).map(x => x.t === 'gap' ? '___' : x.v).join(' ');
      const stu = ans.cs[t.gap_index] || '';
      out.push({ sec: '① 选词填空', q: `空 ${t.gap_index}：…${pre} [____] ${post}…`, stu, key: t.answer, ok: stu === t.answer });
    });
    const opt = (o, i) => (i === null || i === undefined || !o[i]) ? '' : L[i] + '. ' + o[i];
    const keyOpt = (o, a) => { const i = o.indexOf(a); return (i >= 0 ? L[i] + '. ' : '') + a; };
    out.push({ sec: '② 选句填空', q: '…' + cur.cp.before.slice(-120) + ' [____]',
      stu: opt(cur.cp.options, ans.cp), key: keyOpt(cur.cp.options, cur.cp.answer), ok: cur.cp.options[ans.cp] === cur.cp.answer });
    cur.hl.questions.forEach((h, j) => {
      const k = j === 0 ? 'h1' : 'h2';
      out.push({ sec: (j === 0 ? '③' : '④') + ' 高亮 ' + (j + 1), q: h.question, stu: ans[k] || '', key: h.answer, ok: norm(ans[k]) === norm(h.answer) });
    });
    out.push({ sec: '⑤ 选主旨', q: cur.idea.instruction, stu: opt(cur.idea.options, ans.idea), key: keyOpt(cur.idea.options, cur.idea.answer), ok: cur.idea.options[ans.idea] === cur.idea.answer });
    out.push({ sec: '⑥ 选标题', q: cur.title.instruction, stu: opt(cur.title.options, ans.title), key: keyOpt(cur.title.options, cur.title.answer), ok: cur.title.options[ans.title] === cur.title.answer });
    return out;
  }

  const origGrade = grade;
  grade = function () {
    if (done) return;
    if (!who.value.trim()) {
      const n = (prompt('交卷前请输入你的名字（老师靠它认出你）') || '').trim();
      if (n) { who.value = n; try { localStorage.setItem(NAME_KEY, n); } catch (e) {} }
    }
    origGrade();
    const its = items();
    const score = its.filter(x => x.ok).length;
    const r = row('submitted');
    r.grading = { items: its, difficulty: cur.difficulty };
    r.score = score;
    r.total = its.length;
    if (r.student_name) {
      SB.saveSubmission(r, { now: true });
      $('body').insertAdjacentHTML('afterbegin', '<div class="ans" style="margin-top:0">✅ 作答已自动发送给老师，不用再手动发成绩码了。</div>');
    } else {
      $('body').insertAdjacentHTML('afterbegin', '<div class="todo">⚠ 没有填写名字，作答没有发送给老师。请把下面的成绩码发给老师。</div>');
    }
  };
  $('submit').onclick = grade;

  /* ---------- 启动 ---------- */
  try { who.value = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
  who.placeholder = '先填你的名字';
  if (!who.value) { who.style.borderColor = '#f59e0b'; who.addEventListener('input', () => who.style.borderColor = '', { once: true }); }
  SB.start();

  // 直达链接：页面地址末尾 #401 → 打开第 401 套
  function openFromHash() {
    const i = SETS.findIndex(s => String(s.num) === location.hash.slice(1));
    if (i < 0 || SETS[i] === cur) return false;
    $('pick').value = i;
    load(i);
    return true;
  }
  window.addEventListener('hashchange', openFromHash);
  $('pick').addEventListener('change', () => history.replaceState(null, '', '#' + cur.num));
  if (!openFromHash()) tryRestore();
})();

</script>
