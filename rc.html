const $=id=>document.getElementById(id);
let cur,ans={},left=180,tid=null,done=false;
const blanksOf=()=>cur.tokens.filter(z=>typeof z!=="string");

function init(){
  SETS.forEach((s,i)=>{const o=document.createElement("option");o.value=i;
    o.textContent="#"+s.num+"  "+({super_easy:"Super Easy",easy:"Easy",medium:"Medium"}[s.difficulty]||s.difficulty)+"  ("+s.nblanks+" 词)";$("pick").appendChild(o);});
  $("pick").onchange=()=>load($("pick").value);
  $("submit").onclick=()=>grade();
  $("retry").onclick=()=>load($("pick").value);
  load(0);
}
function load(i){
  cur=SETS[i];$("pick").value=i;ans={};done=false;left=cur.timer;clearInterval(tid);
  $("diff").textContent=cur.det;$("diff").className="pill "+cur.difficulty;
  $("title").textContent=cur.title;$("result").innerHTML="";$("submit").disabled=false;
  draw();tick();tid=setInterval(tick,1000);
}
function draw(){
  const box=$("passage");box.innerHTML="";let n=0;
  cur.tokens.forEach(t=>{
    if(typeof t==="string"){box.appendChild(document.createTextNode(t));return}
    const k=++n,w=document.createElement("span");w.className="w";w.dataset.k=k;
    const g=document.createElement("span");g.className="g";g.textContent=t[0];w.appendChild(g);
    const miss=t[1].length,v0=(ans[k]||"");
    for(let j=0;j<miss;j++){
      const x=document.createElement("input");x.maxLength=1;x.autocomplete="off";x.autocapitalize="off";x.spellcheck=false;
      x.value=(v0[j]||"").trim();x.dataset.k=k;x.dataset.j=j;
      x.oninput=()=>{const v=x.value.replace(/\s/g,"");x.value=v.slice(-1);setLetter(k,j,x.value,miss);
        if(x.value){const nx=nextInput(x);nx&&nx.focus()}};
      x.onkeydown=e=>{if(e.key==="Backspace"&&!x.value){const p=prevInput(x);if(p){p.focus();p.value="";setLetter(+p.dataset.k,+p.dataset.j,"",blanksOf()[+p.dataset.k-1][1].length)}e.preventDefault()}
        else if(e.key==="ArrowLeft"){const p=prevInput(x);p&&p.focus()}else if(e.key==="ArrowRight"){const p=nextInput(x);p&&p.focus()}};
      x.onfocus=()=>x.select();
      w.appendChild(x);
    }
    box.appendChild(w);
  });
}
const inputs=()=>[...$("passage").querySelectorAll("input")];
const nextInput=x=>{const a=inputs();return a[a.indexOf(x)+1]};
const prevInput=x=>{const a=inputs();return a[a.indexOf(x)-1]};
function setLetter(k,j,v,miss){
  const a=(ans[k]||"").padEnd(miss," ").split("");a[j]=v||" ";
  const s=a.join("").replace(/\s+$/,"");
  if(s.trim())ans[k]=s;else delete ans[k];
}
function tick(){
  if(done)return;
  const m=Math.floor(Math.max(left,0)/60),s=Math.max(left,0)%60;
  $("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  $("timer").className=left<=30?"warn":"";
  if(left<=0){grade();return}
  left--;
}
function grade(){
  if(done)return;done=true;clearInterval(tid);$("submit").disabled=true;
  let ok=0,tot=0;
  $("passage").querySelectorAll(".w").forEach(w=>{
    const k=+w.dataset.k,t=blanksOf()[k-1];
    const stu=(ans[k]||"").padEnd(t[1].length," ");
    const good=stu.toLowerCase()===t[1].toLowerCase();tot++;if(good)ok++;
    w.classList.add(good?"ok":"no");w.querySelectorAll("input").forEach(i=>i.disabled=true);
    if(!good){const f=document.createElement("span");f.className="fix";f.textContent="→ "+t[0]+t[1];w.appendChild(f)}
  });
  $("result").innerHTML='<div class="res">得分：'+ok+' / '+tot+'（'+Math.round(ok/tot*100)+'%）</div>';
}
init();
</script>

  const rpc = (fn, args, opt = {}) => api('rpc/' + fn, Object.assign({ method: 'POST', body: JSON.stringify(args) }, opt));

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  }

  /* ---------- 状态角标 ---------- */
  const css = `
  #sb-badge{position:fixed;left:12px;bottom:12px;z-index:9999;font:12.5px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    padding:5px 11px;border-radius:99px;background:#f3f4f6;color:#4b5563;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  #sb-badge.ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
  #sb-badge.err{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
  #sb-badge.busy{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
  #sb-tip{position:absolute;z-index:10000;display:none;font:13px/1 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:#111827;color:#fff;border:0;border-radius:7px;padding:7px 11px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:nowrap}
  #sb-tip:hover{background:#1f2937}
  #sb-bookbtn{position:fixed;right:12px;bottom:12px;z-index:9999;font:13px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    padding:7px 13px;border-radius:99px;border:1px solid #fcd34d;background:#fffbeb;color:#92400e;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  #sb-book{position:fixed;right:12px;bottom:56px;z-index:9999;width:min(340px,calc(100vw - 24px));max-height:60vh;overflow:auto;display:none;
    background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:12px;
    font:13.5px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#1f2937}
  #sb-book h4{margin:0 0 4px;font-size:14px}
  #sb-book .hint{color:#6b7280;font-size:12px;margin-bottom:8px}
  #sb-book .it{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid #f3f4f6}
  #sb-book .it b{color:#92400e}
  #sb-book .it .cx{color:#6b7280;font-size:12px}
  #sb-book .it button{margin-left:auto;border:0;background:none;color:#9ca3af;cursor:pointer;font-size:15px;padding:0 2px}
  #sb-book .it button:hover{color:#dc2626}
  .sbv{background:#fef3c7;border-bottom:2px solid #f59e0b;border-radius:2px}
  #sb-toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:10001;background:#111827;color:#fff;
    padding:8px 14px;border-radius:8px;font:13.5px -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:none}
  `;
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);

  const badge = document.createElement('div');
  badge.id = 'sb-badge';
  badge.dataset.novocab = '1';
  document.body.appendChild(badge);
  function setBadge(kind, text) { badge.className = kind; badge.textContent = text; }

  const toastEl = document.createElement('div');
  toastEl.id = 'sb-toast';
  document.body.appendChild(toastEl);
  function toast(msg) {
    toastEl.textContent = msg; toastEl.style.display = 'block';
    clearTimeout(toast._h); toast._h = setTimeout(() => toastEl.style.display = 'none', 2200);
  }
  const hhmm = () => new Date().toTimeString().slice(0, 5);

  /* ---------- 作答保存（同一次作答一行，反复覆盖） ---------- */
  let pending = null, inflight = false;
  async function flush() {
    if (inflight || !pending) return;
    const { row, keepalive } = pending;
    pending = null; inflight = true;
    setBadge('busy', '☁ 保存中…');
    try {
      await rpc('student_save', { p: row }, { keepalive });
      setBadge('ok', row.status === 'submitted' ? '✅ 已交卷，老师已收到 ' + hhmm() : '☁ 已自动保存 ' + hhmm());
      if (row.status === 'submitted') saveSubmission.lastOk = row.id;
    } catch (e) {
      console.warn('[sync]', e);
      setBadge('err', '⚠ 保存失败，正在重试…（请检查网络）');
      if (!pending) pending = { row, keepalive };   // 失败的留着重试，除非已有更新的
      setTimeout(flush, 5000);
    } finally {
      inflight = false;
      if (pending) setTimeout(flush, 300);
    }
  }
  function saveSubmission(row, { now = false } = {}) {
    row = Object.assign({ task_type: A().task, updated_at: new Date().toISOString() }, row);
    pending = { row, keepalive: now };
    if (now) flush();
    else { clearTimeout(saveSubmission._t); saveSubmission._t = setTimeout(flush, 1500); }
  }
  async function findInProgress(name, setNum) {
    const rows = await rpc('student_find', { p_name: name, p_task: A().task, p_set: setNum });
    return rows && rows[0];
  }
  async function markAbandoned(id) {
    await rpc('student_abandon', { p_id: id, p_name: A().getName() });
  }

  /* ---------- 生词本 ---------- */
  const A = () => window.SYNC_ADAPTER;
  let vocab = [];            // 当前学生的生词行
  let vocabOwner = null;

  const tip = document.createElement('button');
  tip.id = 'sb-tip';
  tip.textContent = '📌 标为生词';
  tip.dataset.novocab = '1';
  document.body.appendChild(tip);

  const bookBtn = document.createElement('button');
  bookBtn.id = 'sb-bookbtn';
  bookBtn.dataset.novocab = '1';
  document.body.appendChild(bookBtn);
  const book = document.createElement('div');
  book.id = 'sb-book';
  book.dataset.novocab = '1';
  document.body.appendChild(book);
  bookBtn.onclick = () => { book.style.display = book.style.display === 'block' ? 'none' : 'block'; renderBook(); };

  function renderBook() {
    bookBtn.textContent = '📒 我的生词本 (' + vocab.length + ')';
    if (book.style.display !== 'block') return;
    const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    book.innerHTML = `<h4>📒 我的生词本</h4><div class="hint">用鼠标选中文章里不认识的词 → 点「📌 标为生词」，老师那边会同步收到。</div>` +
      (vocab.length ? vocab.map(v => `<div class="it"><div><b>${esc(v.word)}</b> <span class="cx">· ${esc(v.task_type)} #${esc(v.set_num)}</span>` +
        (v.context ? `<div class="cx">${esc(v.context.length > 90 ? v.context.slice(0, 90) + '…' : v.context)}</div>` : '') +
        `</div><button title="删除" data-id="${esc(v.id)}">×</button></div>`).join('')
        : '<div class="cx">还没有标记生词</div>');
    book.querySelectorAll('button[data-id]').forEach(b => b.onclick = () => removeWord(b.dataset.id));
  }

  async function loadVocab(force) {
    const name = A().getName();
    if (!name) { vocab = []; vocabOwner = null; renderBook(); highlight(); return; }
    if (!force && name === vocabOwner) return;
    vocabOwner = name;
    try {
      vocab = await rpc('vocab_list', { p_name: name }) || [];
    } catch (e) { console.warn('[vocab]', e); }
    renderBook(); highlight();
  }

  function ensureName() {
    let n = A().getName();
    if (n) return n;
    n = (prompt('请先输入你的名字（老师靠它认出你）') || '').trim();
    if (n) A().setName(n);
    return n;
  }

  function sentenceAround(text, word) {
    if (!text) return '';
    const sents = text.replace(/\s+/g, ' ').match(/[^.!?。！？]+[.!?。！？]*["”’)]*/g) || [text];
    const re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
    const s = sents.find(x => re.test(x)) || '';
    return s.trim().slice(0, 400);
  }

  async function addWord(word, node) {
    const name = ensureName();
    if (!name) { toast('没有名字，生词没法保存'); return; }
    if (vocabOwner !== name) await loadVocab(true);
    if (vocab.some(v => v.word.toLowerCase() === word.toLowerCase())) { toast('「' + word + '」已经在生词本里了'); return; }
    let ctx = '';
    try { ctx = (A().contextFor && A().contextFor(word, node)) || ''; } catch (e) {}
    if (!ctx) {
      const blk = node && (node.nodeType === 1 ? node : node.parentElement);
      const box = blk && blk.closest('p,div,li,td');
      ctx = sentenceAround(box ? box.textContent : '', word);
    }
    const row = { id: uuid(), student_name: name, task_type: A().task, set_num: A().setNum(), word, context: ctx };
    vocab.unshift(Object.assign({ created_at: new Date().toISOString() }, row));
    renderBook(); highlight();
    toast('已加入生词本：' + word);
    try {
      await rpc('vocab_add', { p: row });
    } catch (e) {
      console.warn('[vocab]', e);
      vocab = vocab.filter(v => v.id !== row.id);
      renderBook(); highlight();
      toast('⚠ 生词保存失败，请检查网络后重试');
    }
  }

  async function removeWord(id) {
    const old = vocab;
    vocab = vocab.filter(v => v.id !== id);
    renderBook(); highlight();
    try { await rpc('vocab_remove', { p_id: id, p_name: vocabOwner }); }
    catch (e) { vocab = old; renderBook(); highlight(); toast('⚠ 删除失败，请检查网络'); }
  }

  /* 选中文字 → 浮出按钮 */
  let selWord = '', selNode = null, snap = null;
  const SKIP = 'input,textarea,select,option,button,[data-novocab]';
  document.addEventListener('mousedown', e => {
    if (tip.contains(e.target)) return;
    tip.style.display = 'none';
    try { snap = A().snapshot ? A().snapshot() : null; } catch (err) { snap = null; }
  }, true);
  function onSelEnd(e) {
    if (e && tip.contains(e.target)) return;
    setTimeout(() => {
      const sel = window.getSelection();
      const raw = sel ? sel.toString() : '';
      const w = raw.replace(/\s+/g, ' ').trim().replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, '');
      if (!sel || sel.isCollapsed || !w || w.length > 40 || w.split(' ').length > 4 || !/[A-Za-z]/.test(w)) { tip.style.display = 'none'; return; }
      const range = sel.getRangeAt(0);
      const anc = range.commonAncestorContainer;
      const el = anc.nodeType === 1 ? anc : anc.parentElement;
      const root = document.querySelector(A().hlRoot);
      if (!el || !root || !root.contains(el) || el.closest(SKIP)) { tip.style.display = 'none'; return; }
      selWord = w; selNode = anc;
      const rect = range.getBoundingClientRect();
      tip.textContent = A().snapshot ? '📌 标为生词（不影响你的答案）' : '📌 标为生词';
      tip.style.display = 'block';
      tip.style.left = Math.max(8, window.scrollX + rect.left + rect.width / 2 - tip.offsetWidth / 2) + 'px';
      tip.style.top = (window.scrollY + rect.top - tip.offsetHeight - 8) + 'px';
    }, 0);
  }
  document.addEventListener('mouseup', onSelEnd);
  document.addEventListener('touchend', onSelEnd);
  tip.addEventListener('mousedown', e => e.preventDefault());
  tip.addEventListener('click', () => {
    tip.style.display = 'none';
    if (snap && A().restore) { try { A().restore(snap); } catch (e) {} }
    const w = selWord, n = selNode;
    window.getSelection().removeAllRanges();
    if (w) addWord(w, n);
  });

  /* 生词高亮：只改动需要改动的文本节点，避免打断学生的选区 */
  let hlBusy = false;
  function highlight() {
    const root = document.querySelector(A().hlRoot);
    if (!root || hlBusy) return;
    hlBusy = true;
    try {
      const set = new Set(vocab.map(v => v.word.toLowerCase()));
      let unwrapped = false;
      root.querySelectorAll('span.sbv').forEach(s => {
        if (!set.has(s.dataset.w)) { s.replaceWith(document.createTextNode(s.textContent)); unwrapped = true; }
      });
      if (unwrapped) root.normalize();
      if (!set.size) return;
      const words = [...set].sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+'));
      const re = new RegExp('\\b(' + words.join('|') + ')\\b', 'gi');
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: n => (n.parentElement.closest(SKIP + ',span.sbv,script,style') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT)
      });
      const nodes = [];
      while (walker.nextNode()) { re.lastIndex = 0; if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode); }
      nodes.forEach(n => {
        const frag = document.createDocumentFragment();
        const s = n.nodeValue;
        let last = 0;
        re.lastIndex = 0;
        for (let m; (m = re.exec(s));) {
          if (m.index > last) frag.appendChild(document.createTextNode(s.slice(last, m.index)));
          const sp = document.createElement('span');
          sp.className = 'sbv';
          sp.dataset.w = m[0].toLowerCase().replace(/\s+/g, ' ');
          sp.textContent = m[0];
          frag.appendChild(sp);
          last = m.index + m[0].length;
        }
        if (last < s.length) frag.appendChild(document.createTextNode(s.slice(last)));
        n.replaceWith(frag);
      });
    } finally {
      mo.takeRecords();
      hlBusy = false;
    }
  }
  const mo = new MutationObserver(() => { clearTimeout(highlight._t); highlight._t = setTimeout(highlight, 120); });

  function start() {
    const root = document.querySelector(A().hlRoot);
    if (root) mo.observe(root, { childList: true, subtree: true, characterData: true });
    if (!A().getName()) setBadge('', '☁ 填写名字后开始自动保存');
    else setBadge('', '☁ 云同步已就绪');
    loadVocab(true);
  }

  return { api, uuid, saveSubmission, findInProgress, markAbandoned, loadVocab, setBadge, toast, start };
})();

/* ================= Read and Complete 适配器 =================
 * 依赖原页面的全局变量：cur, ans, left, done, SETS
 * 以及函数：load, draw, grade
 * answers = { fills: {空号: 已填字母}, text: 带填写的全文（老师后台实时显示用）, filled, total }
 */
(() => {
  const NAME_KEY = 'sb_student_name';
  const who = $('who');
  let sid = SB.uuid();
  let lastSig = '', lastBeat = 0;
  try { who.value = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}

  const blanks = () => cur.tokens.filter(z => typeof z !== 'string');
  const fillOf = (k, t) => { const a = (ans[k] || '').padEnd(t[1].length, ' '); return a.split('').map(c => c === ' ' ? '_' : c).join(''); };
  function viewText() {
    let k = 0;
    return cur.tokens.map(t => typeof t === 'string' ? t : t[0] + fillOf(++k, t)).join('');
  }
  const filledCount = () => blanks().filter((t, i) => (ans[i + 1] || '').trim()).length;

  window.SYNC_ADAPTER = {
    task: 'RC',
    hlRoot: '#passage',
    getName: () => who.value.trim(),
    setName: n => { who.value = n; onName(); },
    setNum: () => cur.num
  };

  function row(status) {
    return {
      id: sid, student_name: who.value.trim(), set_num: cur.num, si: 0, status,
      answers: { fills: ans, text: viewText(), filled: filledCount(), total: blanks().length, difficulty: cur.difficulty },
      left_seconds: Math.max(left, 0), time_used_seconds: cur.timer - Math.max(left, 0)
    };
  }
  function autosave() {
    if (done || !who.value.trim()) return;
    if (!filledCount()) return;
    const sig = JSON.stringify([cur.num, ans, who.value.trim()]);
    const now = Date.now();
    if (sig !== lastSig || now - lastBeat > 20000) {
      lastSig = sig; lastBeat = now;
      SB.saveSubmission(row('in_progress'));
    }
  }
  setInterval(autosave, 1500);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && !done && who.value.trim() && lastSig) SB.saveSubmission(row('in_progress'), { now: true });
  });

  /* ---------- 断点续做 ---------- */
  async function tryRestore() {
    const name = who.value.trim();
    if (!name || done) return;
    const num = cur.num;
    let r;
    try { r = await SB.findInProgress(name, num); } catch (e) { console.warn(e); return; }
    if (!r || r.id === sid || cur.num !== num || done) return;
    if (Date.now() - new Date(r.updated_at).getTime() > 7 * 86400e3) return;
    const lf = r.left_seconds || 0;
    if (confirm(`检测到你上次做 #${num} 还没交卷（已填 ${(r.answers && r.answers.filled) || 0} 个词，剩 ${Math.floor(lf / 60)} 分 ${lf % 60} 秒）。\n\n要接着上次继续做吗？\n（选「取消」则重新开始）`)) {
      sid = r.id;
      ans = Object.assign({}, (r.answers && r.answers.fills) || {});
      if (lf > 0) left = lf;
      lastSig = '';
      draw();
      SB.toast('已恢复上次的作答');
    } else {
      SB.markAbandoned(r.id).catch(() => {});
    }
  }
  function onName() {
    const n = who.value.trim();
    try { localStorage.setItem(NAME_KEY, n); } catch (e) {}
    SB.loadVocab();
    if (n) SB.setBadge('', '☁ 云同步已就绪');
    tryRestore();
  }
  who.addEventListener('change', onName);
  who.addEventListener('keydown', e => { if (e.key === 'Enter') who.blur(); });

  /* ---------- 换题：新的一次作答 ---------- */
  const origLoad = load;
  load = function (i) {
    if (!done && lastSig && who.value.trim()) SB.saveSubmission(row('in_progress'), { now: true });
    origLoad(i);
    sid = SB.uuid(); lastSig = ''; lastBeat = 0;
    tryRestore();
  };

  /* ---------- 交卷：上传逐词对错 ---------- */
  function items() {
    const out = [];
    let k = 0;
    cur.tokens.forEach((t, i) => {
      if (typeof t === 'string') return;
      k++;
      const pre = cur.tokens.slice(Math.max(0, i - 3), i).map(x => typeof x === 'string' ? x : x[0] + x[1]).join('');
      const post = (cur.tokens[i + 1] || '').toString().slice(0, 20);
      const stuLetters = (ans[k] || '').padEnd(t[1].length, ' ');
      const stu = (ans[k] || '').trim() ? t[0] + stuLetters.replace(/ /g, '_') : '';
      out.push({
        sec: '补全单词', q: `空 ${k}：…${pre.slice(-40)}${t[0]}${'_'.repeat(t[1].length)}${post}…`,
        stu, key: t[0] + t[1], ok: stuLetters.toLowerCase() === t[1].toLowerCase()
      });
    });
    return out;
  }
  const origGrade = grade;
  grade = function () {
    if (done) return;
    if (!who.value.trim()) {
      const n = (prompt('交卷前请输入你的名字（老师靠它认出你）') || '').trim();
      if (n) { who.value = n; try { localStorage.setItem(NAME_KEY, n); } catch (e) {} }
    }
    origGrade();
    const its = items();
    const r = row('submitted');
    r.grading = { items: its, difficulty: cur.difficulty };
    r.score = its.filter(x => x.ok).length;
    r.total = its.length;
    if (r.student_name) {
      SB.saveSubmission(r, { now: true });
      $('result').insertAdjacentHTML('beforeend', '<div class="res">✅ 作答已自动发送给老师，不用再手动发送。</div>');
    } else {
      $('result').insertAdjacentHTML('beforeend', '<div class="todo">⚠ 没有填写名字，作答没有发送给老师。</div>');
    }
  };
  $('submit').onclick = grade;

  SB.start();
  if (who.value.trim()) onName();

  // 直达链接：页面地址末尾 #1566 → 直接打开这一题
  function openFromHash() {
    const n = Number(location.hash.slice(1));
    const i = SETS.findIndex(s => s.num === n);
    if (i >= 0 && cur.num !== n) load(i);
  }
  window.addEventListener('hashchange', openFromHash);
  openFromHash();
})();

</script>
</body></html>
